[build]
  command = "npm install --prefix mcp-server"
  publish = "."
  functions = "netlify/functions"

[functions."keep-alive"]
  schedule = "@daily"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# MCP OAuth discovery documents (RFC 9728 / RFC 8414). Claude.ai (or any MCP
# client) probes these well-known paths to find the /authorize, /token, and
# /register endpoints — see passports-mcp-server-spec.md. Each maps to its
# own function (not one function branching on a query param) — a query
# param survived a caching layer incorrectly in production and served the
# wrong document, breaking client registration; distinct paths remove that
# ambiguity entirely regardless of the caching layer involved.
[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/mcp-oauth-metadata-resource"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/mcp-oauth-metadata-authorization-server"
  status = 200

# The same two documents at their path-aware locations. RFC 9728/8414 tell a
# client that for a resource at https://host/api/mcp it should look under
# /.well-known/<doc>/api/mcp — many clients try that form FIRST. Without these
# rules the catch-all below answered those URLs with index.html and a 200,
# so a client asking for JSON got HTML and a success status: it parses, throws,
# and the sign-in flow dies before it ever reaches us (no request in our logs).
#
# Exact path here, not a splat: the protected-resource document names the
# resource it describes ("resource": ".../api/mcp"), and RFC 9728 has the
# client check that field against the resource it was discovering. A splat
# would answer /.well-known/oauth-protected-resource/<anything> with a
# document describing /api/mcp — a document that contradicts its own URL.
# /api/mcp is the only protected resource we expose; a second one would need
# its own rule here (and its own value in that field).
[[redirects]]
  from = "/.well-known/oauth-protected-resource/api/mcp"
  to = "/.netlify/functions/mcp-oauth-metadata-resource"
  status = 200

# The authorization-server document must NOT be served under a path suffix.
# RFC 8414 builds the metadata URL by inserting the well-known segment between
# host and path of the *issuer*, so /.well-known/oauth-authorization-server
# /api/mcp asks about an issuer of "https://host/api/mcp". Our issuer is the
# bare origin, so a document returned there fails RFC 8414's check that the
# issuer field matches the issuer the URL asked about — and on that mismatch
# the client MUST NOT use the document. Answering with a 404 instead lets it
# fall back to the suffix-less URL above, which is the one that matches.
#
# (This rule previously served the document at any suffix, on the reasoning
# that the document is internally self-consistent. That reasoning was wrong:
# 8414 validates the issuer against the request URL, not the document alone.
# It is the same trap this whole file is about — a parseable 200 carrying the
# wrong answer is worse than an honest 404, because it defeats the fallback.)
[[redirects]]
  from = "/.well-known/oauth-authorization-server/*"
  to = "/.netlify/functions/well-known-not-found"
  status = 200

# Same reasoning for any protected-resource path other than our one real
# resource, matched exactly above: we have no such resource, so say so.
[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "/.netlify/functions/well-known-not-found"
  status = 200

# We are an OAuth 2.0 server, not an OpenID Connect provider. Clients probe
# this path anyway, so answer with an honest 404 rather than letting the
# catch-all hand back HTML with a 200 — same failure mode as above.
# `status = 200` here means "rewrite to this function", not "reply 200": the
# function's own 404 is what reaches the client, the same way /api/* already
# passes through 401s and 201s from its functions.
[[redirects]]
  from = "/.well-known/openid-configuration"
  to = "/.netlify/functions/well-known-not-found"
  status = 200

[[redirects]]
  from = "/.well-known/openid-configuration/*"
  to = "/.netlify/functions/well-known-not-found"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
